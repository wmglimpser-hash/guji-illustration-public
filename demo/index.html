<!-- pdf.js：优先加载本地（static/pdf.min.js），本地不存在时回退 CDN -->
<script>(function () {
  var LOCAL  = 'static/pdf.min.js';
  var CDN    = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  var LOCAL_W = 'static/pdf.worker.min.js';
  var CDN_W   = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  function attach(src, workerSrc) {
    var s = document.createElement('script');
    s.src = src;
    s.crossOrigin = 'anonymous';
    s.onload  = function () { if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = workerSrc; };
    s.onerror = function () {
      if (src === LOCAL) {
        // 本地文件不存在，回退 CDN
        attach(CDN, CDN_W);
      }
      // CDN 也失败：pdfjsLib 保持 undefined，后续 importFromPDF 会给出明确提示
    };
    document.head.appendChild(s);
  }
  attach(LOCAL, LOCAL_W);
})();
</script>

    content: "∅";
  }
  .reference-uncertain-mark {
    border-radius: 2px;
    background: rgba(143, 105, 177, .11);
    text-decoration: underline wavy #8b5cad 1.5px;
    text-underline-offset: .23em;
    cursor: pointer;
  }
  .reference-uncertain-mark.is-selected {
    background: rgba(143, 105, 177, .23);
    box-shadow: 0 0 0 1px rgba(119, 75, 153, .42);
  }
  .reference-uncertainty-count {
    min-width: 1.5em;
    padding: 1px 5px;
    border-radius: 999px;
    background: #eee3f4;
    color: #70488e;
    font: 10px var(--f-mono);
    text-align: center;
  }
  @media (max-width: 1280px) {
    .pane-reference {
      width: 390px;
      flex-basis: 390px;
      min-width: 330px;
    }
  }

  /* ---------- left list ---------- */
  .left-head {
    padding: 14px 14px 10px;
    border-bottom: 1px solid var(--c-border);
  }
  .left-head h3 {
    margin: 0 0 10px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--c-text-mute);
    font-weight: 600;
  }
  .left-head select, .left-head input {
    width: 100%;
    height: 30px;
    border: 1px solid var(--c-border-strong);
    border-radius: var(--r-ctrl);
    padding: 0 8px;
    background: #fff;
    font-size: 13px;
    margin-bottom: 6px;
  }
  .left-head input:focus, .left-head select:focus {
    outline: none;
    border-color: var(--c-primary);
    box-shadow: 0 0 0 3px rgba(46,109,164,0.15);
  }
  .left-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }
  .left-actions .btn {
    flex: 1 1 calc(50% - 3px);
    min-width: 0;
    padding: 6px 8px;
    font-size: 13px;
  }
  .left-batch-note {
    margin-top: 6px;
    font-size: 13px;
    color: var(--c-text-soft);
  }
  .left-list {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 8px 8px 16px;
  }
  .img-card {
    display: grid;
    grid-template-columns: 72px 1fr;
    gap: 12px;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid transparent;
    border-left: 3px solid transparent;
    background: transparent;
    margin-bottom: 6px;
    cursor: pointer;
    align-items: center;
    transition: background .15s;
  }
  .img-card:hover { background: rgba(46,109,164,0.06); }
  .img-card.active {
    background: #eaf2fb;
    border-left-color: var(--c-primary);
  }
  .img-card .thumb {
    width: 72px; height: 72px;
    border-radius: 6px;
    border: 1px solid var(--c-border);
    background: #fff;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .img-card .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .img-card .meta { min-width: 0; }
  .img-card .meta .id {
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--c-text-mute);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .img-card .meta .title {
    font-size: 13px;
    color: var(--c-text);
    margin: 2px 0 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .img-card-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 2px;
  }
  .img-card-check {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    border: 1px solid var(--c-border-strong);
    background: #fff;
    color: transparent;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    flex: 0 0 auto;
    cursor: pointer;
    transition: all .15s ease;
  }
  .img-card-check.active {
    background: var(--c-primary);
    border-color: var(--c-primary);
    color: #fff;
  }
  .img-card-check:disabled {
    cursor: not-allowed;
    opacity: 0.45;
    background: #f3f4f6;
  }
  .img-card-head .title {
    margin: 0;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: var(--r-pill);
    line-height: 1.6;
    font-weight: 500;
  }
  .pill .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor;
  }
  .pill.todo { background: #eef0f3; color: #6b7280; }
  .pill.running { background: #e3f2fd; color: var(--c-progress); }
  .pill.review { background: #fff4e3; color: #c2680a; }
  .pill.ok { background: #e6f5e7; color: #2f8a36; }
  .pill.bad { background: #fdecea; color: #c1352b; }
  .pill.running .dot { animation: pulse 1s infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }
  .empty-list {
    padding: 30px 14px;
    text-align: center;
    color: var(--c-text-mute);
    font-size: 13px;
    line-height: 1.7;
  }

  /* ---------- main workspace ---------- */
  /* 扁平 header 带：面包屑/步骤条同一行排布，1px 分隔线代替卡片堆叠 */
  #main-header {
    flex-shrink: 0;
    padding: 0 20px;
    width: 100%;
    background: var(--c-card);
    border-bottom: 1px solid var(--c-border);
    display: flex;
    align-items: center;
    gap: 0 24px;
    flex-wrap: nowrap;
    position: relative;
    min-height: 40px;
  }
  #main-header:empty { padding: 0; border-bottom: none; }
  #main-header .return-context-btn {
    flex: 0 0 auto;
    margin: 0 4px 0 0;
    height: 30px;
    white-space: nowrap;
  }
  /* 面包屑栏：占满整窗宽度（#main-header 已是全窗全宽带），独占一行 */
  #main-header > .gallery-bar {
    flex: 1 1 100%;
    min-height: 40px;
    display: flex;
    align-items: center;
    flex-wrap: nowrap;
    gap: 10px;
    padding-left: 0;
    padding-right: 0;
  }
  #main-header > .gallery-bar > .crumb {
    flex: 1 1 auto;
    min-width: 0;
    justify-content: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #main-header > .gallery-bar > .gallery-bar-actions { flex-shrink: 0; }
  .main-scroll {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 8px 16px 16px;
    max-width: 1400px;
    margin-left: auto;
    margin-right: auto;
    width: 100%;
  }
  .main-scroll.archive-browse-scroll {
    max-width: none;
    padding-left: 24px;
    padding-right: 24px;
    background:
      radial-gradient(circle at 10% 0%, rgba(42, 107, 163, 0.08), transparent 28%),
      linear-gradient(180deg, #f6f8fb 0%, #eef3f7 100%);
  }
  .archive-browse-full {
    width: 100%;
    max-width: none;
  }
  .archive-browse-toolbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 16px;
    padding: 10px 12px;
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid var(--c-border);
    border-radius: 12px;
    box-shadow: 0 8px 22px rgba(31, 54, 82, 0.08);
    backdrop-filter: blur(8px);
  }
  .archive-browse-mode-switch {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 3px;
    background: #edf2f7;
    border: 1px solid #dce5ef;
    border-radius: 9px;
  }
  .archive-browse-mode-btn {
    height: 28px;
    border: 0;
    border-radius: 7px;
    padding: 0 10px;
    background: transparent;
    color: #496176;
    font-size: 12px;
    cursor: pointer;
  }
  .archive-browse-mode-btn.active {
    background: #fff;
    color: #173b5c;
    font-weight: 700;
    box-shadow: 0 2px 8px rgba(28, 60, 89, 0.12);
  }
  .archive-browse-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 16px;
    align-items: stretch;
  }
  .archive-grid-card,
  .archive-list-card {
    background: #fff;
    border: 1px solid var(--c-border);
    border-radius: 14px;
    box-shadow: 0 10px 24px rgba(25, 45, 70, 0.08);
    overflow: hidden;
  }
  .archive-grid-card {
    display: flex;
    flex-direction: column;
    min-height: 380px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .archive-grid-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 28px rgba(25, 45, 70, 0.13);
  }
  .archive-grid-thumb {
    height: 230px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f8f3e8;
    border-bottom: 1px solid #eadfca;
    cursor: zoom-in;
    overflow: hidden;
  }
  .archive-grid-thumb img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .archive-grid-body {
    display: grid;
    gap: 7px;
    padding: 12px 13px 13px;
  }
  .archive-grid-title,
  .archive-list-title {
    color: #1f3347;
    font-family: var(--f-serif);
    font-weight: 700;
    line-height: 1.35;
  }
  .archive-grid-title {
    min-height: 42px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .archive-grid-code,
  .archive-list-code {
    color: #9a6a2a;
    font-family: var(--f-mono);
    font-size: 11px;
    user-select: all;
  }
  .archive-grid-meta,
  .archive-list-book {
    color: var(--c-text-mute);
    font-size: 11.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .archive-grid-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .archive-grid-tags span {
    max-width: 100%;
    padding: 2px 7px;
    background: #f1f6fb;
    border: 1px solid #dce9f5;
    border-radius: 999px;
    color: #486079;
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .archive-grid-actions,
  .archive-list-actions {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .btn.tiny {
    height: 26px;
    padding: 0 8px;
    font-size: 11.5px;
  }
  .archive-browse-list {
    display: grid;
    gap: 12px;
  }
  .archive-list-card {
    display: grid;
    grid-template-columns: 112px minmax(220px, 1fr) minmax(260px, 0.9fr) auto;
    gap: 14px;
    align-items: center;
    padding: 12px;
  }
  .archive-list-thumb {
    width: 112px;
    height: 112px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f8f3e8;
    border: 1px solid #eadfca;
    border-radius: 10px;
    cursor: zoom-in;
    overflow: hidden;
  }
  .archive-list-thumb img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .archive-list-main {
    display: grid;
    gap: 5px;
    min-width: 0;
  }
  .archive-list-excerpt {
    color: #5d6b78;
    font-size: 12px;
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .archive-list-fields {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px 12px;
    color: #31475c;
    font-size: 12px;
    min-width: 0;
  }
  .archive-list-fields div {
    display: grid;
    gap: 2px;
    min-width: 0;
  }
  .archive-list-fields b {
    color: #8b9bab;
    font-size: 11px;
    font-weight: 600;
  }
  .archive-list-fields span {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .archive-list-actions {
    justify-content: flex-end;
    flex-wrap: wrap;
  }
  .archive-browse-detail-list {
    gap: 16px;
    width: 100%;
    align-items: start;
  }
  .archive-browse-detail-list.detail-single {
    display: flex;
    flex-direction: column;
  }
  .archive-browse-detail-list.detail-double {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .archive-detail-card {
    background: #fff;
    border: 1px solid var(--c-border);
    border-radius: 12px;
    box-shadow: var(--shadow-card);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 0;
    width: 100%;
  }
  .archive-detail-row {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
    align-items: stretch;
  }
  @media (max-width: 980px) {
    .main-scroll.archive-browse-scroll {
      padding-left: 12px;
      padding-right: 12px;
    }
    .archive-list-card {
      grid-template-columns: 96px minmax(0, 1fr);
    }
    .archive-list-fields,
    .archive-list-actions {
      grid-column: 1 / -1;
    }
    .archive-browse-detail-list {
      display: flex;
      flex-direction: column;
    }
    .archive-detail-row {
      grid-template-columns: 1fr;
    }
  }

    content: "";
    position: absolute;
    inset: 0;

  .home-stage {
    position: relative;
    z-index: 1;
    width: min(900px, 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-top: clamp(28px, 6vh, 64px);
    animation: homeStageIn .42s ease-out both;

    width: 100%;

      linear-gradient(180deg, rgba(255,255,255,0.78), rgba(255,252,244,0.58));

    box-shadow: 0 24px 70px rgba(39, 49, 61, 0.12), inset 0 1px 0 rgba(255,255,255,0.8);
    padding: 28px 34px 30px;

    backdrop-filter: blur(8px);

    line-height: 1.3;
    color: #1e2f44;

    max-width: 680px;
    margin: 0 auto;
    color: var(--c-text-soft);
    font-size: 14px;
    line-height: 1.9;
  }
  .home-actions {
    margin-top: 6px;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .home-actions .btn {
    min-width: 160px;
    height: 44px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 10px;
  }
  .home-books {
    margin-top: 26px;
    text-align: left;
  }
  .home-books-head {
    display: flex;
    align-items: center;

  }
  .home-books-head h3 {

    color: #21384f;
    letter-spacing: 0.4px;
  }
  .home-books-head .meta {
    font-size: 13px;
    color: var(--c-text-mute);
  }
  .home-book-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(232px, 1fr));
    gap: 14px;
  }
  .home-book-card {
    position: relative;

    border-radius: 16px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.82), rgba(252,250,244,0.7));
    padding: 17px 16px 15px;
    cursor: pointer;
    overflow: hidden;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    animation: homeCardIn .42s ease-out both;
  }
  .home-book-card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 14px;
    bottom: 14px;
    width: 4px;
    border-radius: 0 4px 4px 0;
    background: #65bd55;

    background: #2e6da4;

    border-color: rgba(46,109,164,0.46);
    box-shadow: 0 14px 34px rgba(30, 47, 68, 0.12);
  }
  .home-book-card-edit {
    position: absolute;
    top: 10px;
    right: 10px;
    height: 28px;
    min-width: 46px;
    padding: 0 10px;
    border-radius: 999px;
    border: 1px solid var(--c-border);
    background: rgba(255,255,255,0.92);
    color: var(--c-text-soft);
    font-size: 13px;
    cursor: pointer;

    border-color: var(--c-primary);
    color: var(--c-primary);
    background: #fff;
  }
  .home-book-title {
    font-size: 15px;
    color: #1f3146;
    font-weight: 600;
    line-height: 1.6;

  .home-book-meta {
    margin-top: 8px;

  @keyframes homeStageIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes homeCardIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (max-width: 760px) {

  /* home page: list button & group rows */

    margin-left: auto;

  .img-enhance-bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;

  .img-enhance-bar label { display: flex; align-items: center; gap: 4px; cursor: pointer; user-select:none; }

  .img-nav button:disabled { opacity: 0.4; cursor: not-allowed; }
  .img-counter { font-family: var(--f-mono); font-size: 13px; }

  /* ---------- AI 图文互证结论（置顶卡片）---------- */
  .ai-verdict-card {

    margin-bottom: 12px;

  .ai-verdict-card.v-consistent  { border-left-color: #4caf50; background: #f1faf2; }
  .ai-verdict-card.v-suspect     { border-left-color: #ff9800; background: #fff8f0; }
  .ai-verdict-card.v-conflict    { border-left-color: #f44336; background: #fff5f5; }

  .ai-verdict-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }

  .ai-ctx-header {
    background: #c8960a; color: #fff; font-size: 11.5px;

  /* ---------- 图文互证 ---------- */
  .crossref {
    background: var(--c-paper);
    border: 1px solid #ece6d0;
    border-radius: var(--r-card);
    box-shadow: var(--shadow-card);
    margin-bottom: 16px;
    overflow: hidden;
  }
  .crossref-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 18px;
    border-bottom: 1px solid #ece6d0;
    background: #f6f1e0;
    cursor: pointer;
  }
  .crossref-head h3 {
    margin: 0;
    font-family: var(--f-serif);
    font-size: 15px;
    font-weight: 600;
    color: #5a4a2a;
  }
  .chev { color: #8a7a4a; font-size: 12px; transition: transform .2s; }
  .crossref.collapsed .chev { transform: rotate(180deg); }
  .crossref.collapsed .crossref-body { display: none; }
  .crossref-body textarea { max-height: 180px; resize: vertical; }
  .crossref-body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
  }
  .crossref-col {
    padding: 14px 18px;
  }
  .crossref-col + .crossref-col {
    border-left: 1px dashed #d8cfb1;
  }
  .crossref-col h4 {
    margin: 0 0 8px;
    font-size: 12px;
    color: #8a7a4a;
    font-weight: 600;
    letter-spacing: 0.5px;

  .crossref-col textarea {
    width: 100%;

  .feature-list {
    font-family: var(--f-serif);

  .verdict {

    margin-bottom: 10px;
    font-size: 13px;

  }
  .verdict label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
  .crossref-col input[type=text] {
    width: 100%;
    height: 30px;
    padding: 0 10px;
    border: 1px solid #ece6d0;
    border-radius: var(--r-ctrl);
    background: #fffdf6;
    font-size: 13px;
  }
  .crossref-col input[type=text]:focus { outline: none; border-color: #c6b88a; }

    padding: 8px 10px 10px;
    border-top: 1px solid #edf1f5;
    color: var(--c-text);
    font-size: 12.5px;
    line-height: 1.75;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 180px;
    overflow: auto;

  @media (max-width: 1100px) {
    .annotation-info-grid {
      grid-template-columns: 1fr;

  .status-actions {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-top: 10px;
  }
  .btn {
    height: 30px;
    padding: 0 12px;
    border-radius: var(--r-ctrl);
    border: 1px solid var(--c-border-strong);
    background: #fff;
    color: var(--c-text-soft);

    display: inline-flex; align-items: center; gap: 5px;

  .btn:hover:not(:disabled) { border-color: var(--c-primary); color: var(--c-primary); }

  .btn.primary { background: var(--c-primary); border-color: var(--c-primary); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: var(--c-primary-dark); border-color: var(--c-primary-dark); color: #fff; }

  .btn.danger-ghost { color: #c1352b; border-color: #f1bdb7; }
  .btn.danger-ghost:hover:not(:disabled) { background: #fdecea; border-color: #f1bdb7; color: #c1352b; }
  .btn.full { width: 100%; justify-content: center; }
  .btn.lg { height: 36px; padding: 0 16px; font-size: 13px; }

  .field-section {
    margin-bottom: 14px;
  }
  .field-section h4 {
    margin: 16px 0 8px;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 1px;

    width: 100%;

  .field textarea {

  .form-section-title {
    margin: 16px 0 8px;

    letter-spacing: 1px;
    color: var(--c-text-mute);
    font-weight: 600;
  }
  .form-hint {
    margin-top: 8px;
    font-size: 11.5px;
    color: var(--c-text-mute);

  }
  details.form-advanced {
    margin-top: 14px;
    border: 1px solid var(--c-border);
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
  }
  details.form-advanced summary {
    cursor: pointer;
    list-style: none;
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 600;
    color: var(--c-text-soft);

    user-select: none;

  .field input:focus, .field select:focus, .field textarea:focus {

  .radio-group {
    display: flex; gap: 6px; flex-wrap: wrap;
  }

    flex: 1;

  .chip-input {
    border: 1px solid var(--c-border-strong);

  .chip {
    display: inline-flex; align-items: center; gap: 4px;

    background: none; border: none; padding: 0;

    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .multi-tags label {
    padding: 4px 10px;
    border: 1px solid var(--c-border-strong);
    border-radius: var(--r-pill);

    background: #fff;
  }
  .multi-tags input { position: absolute; opacity: 0; pointer-events: none; }
  .multi-tags label.on { background: var(--c-primary); color: #fff; border-color: var(--c-primary); }

  .bottom-actions {
    display: flex; gap: 8px; margin-top: 16px;
  }
  .bottom-actions .btn { flex: 1; justify-content: center; }

  /* ---------- 标注摘要行 ---------- */
  .ann-summary-row {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 8px 12px 10px;
    background: #f4f7fc;
    border-bottom: 1px solid var(--c-border);
  }
  .ann-summary-badge {
    display: inline-flex; align-items: center;
    padding: 2px 10px; border-radius: 12px;
    font-size: 12px; font-weight: 500;
    background: #e5ecf7; color: #3a5a8a;
    max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ann-summary-badge.subject { background: #e9f4ec; color: #2d6a4f; }
  .ann-summary-badge.verdict-ok      { background: #e6f4ea; color: #256941; }
  .ann-summary-badge.verdict-warn    { background: #fff8e1; color: #7a5c10; }
  .ann-summary-badge.verdict-danger  { background: #fdecea; color: #8a2828; }
  .ann-summary-badge.conf            { background: #f3f0fa; color: #5a3a8a; }
  .ann-summary-badge.empty           { background: #f0f0f0; color: #aaa; font-style: italic; }
  .illustration-identity-card {
    padding: 9px 10px;
    border: 1px solid #e8d9b9;
    border-radius: 7px;
    background: linear-gradient(145deg, #fffaf0, #f8f1e3);
  }
  .illustration-identity-primary {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 7px;
  }
  .illustration-identity-code {
    color: #8a5b18;
    font-family: var(--f-mono);
    font-size: 13px;
    font-weight: 650;
    user-select: all;
  }
  .illustration-identity-badge {
    padding: 2px 7px;
    border: 1px solid #c8d9e8;
    border-radius: 999px;
    color: #285b7a;
    background: #eef6fb;
    font-size: 11px;
    font-weight: 650;
  }
  .illustration-identity-sources {
    margin-top: 8px;
    padding-top: 7px;
    border-top: 1px dashed #ddcfb2;
  }
  .illustration-identity-label {
    display: block;
    margin-bottom: 5px;
    color: var(--c-text-mute);
    font-size: 11px;
  }
  .illustration-identity-source-list { display: flex; flex-wrap: wrap; gap: 5px; }
  .illustration-identity-source {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 6px;
    border-radius: 4px;
    color: #5d6670;
    background: rgba(255,255,255,.78);
    box-shadow: inset 0 0 0 1px rgba(120,105,78,.15);
    font-family: var(--f-mono);
    font-size: 11px;
    user-select: all;
  }
  .illustration-identity-source.owner { color: #7b4f12; background: #fff4d9; }
  .illustration-identity-source small {
    padding: 1px 4px;
    border-radius: 3px;
    background: rgba(154,106,42,.12);
    font-family: var(--f-sans);
    font-size: 9px;
  }
  .illustration-identity-actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 8px;
    padding-top: 7px;
    border-top: 1px dashed #ddcfb2;
  }
  .illustration-identity-actions .btn {
    padding: 4px 9px;
    font-size: 11px;
  }

  /* ---------- stats tab ---------- */
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }
  .stat-cell {
    background: #f7f9fc;
    border: 1px solid var(--c-border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .stat-cell .label { font-size: 11.5px; color: var(--c-text-mute); }
  .stat-cell .value { font-size: 22px; font-weight: 600; margin-top: 2px; font-family: var(--f-mono); }
  .stat-cell.ok .value { color: var(--c-success); }
  .stat-cell.review .value { color: var(--c-warning); }
  .stat-cell.bad .value { color: var(--c-error); }
  .stat-cell.todo .value { color: var(--c-text-mute); }

  .progress-wrap {
    margin: 14px 0 18px;
  }
  .progress-wrap .pct {
    display: flex; justify-content: space-between;
    font-size: 13px; color: var(--c-text-soft);
    margin-bottom: 4px;
  }
  .progress-bar {
    height: 8px;
    background: #ecedef;
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-bar > div {
    height: 100%;
    background: var(--c-success);
    transition: width .3s;
  }

  .chart-section h4 {
    margin: 14px 0 8px;
    font-size: 11.5px;
    letter-spacing: 1px;
    color: var(--c-text-mute);
    text-transform: uppercase;
  }
  .bar-row {
    display: grid;
    grid-template-columns: 84px 1fr 28px;
    gap: 8px;
    align-items: center;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .bar-row .name { color: var(--c-text-soft); }
  .bar-row .bar {
    height: 12px;
    background: #ecedef;
    border-radius: 3px;
    overflow: hidden;
  }
  .bar-row .bar > div {
    height: 100%;
    background: var(--c-primary);
    border-radius: 3px;
  }
  .bar-row .n { text-align: right; font-family: var(--f-mono); color: var(--c-text-soft); }

  .conf-row {
    display: flex; gap: 8px; align-items: center;
    font-size: 13px; color: var(--c-text-soft);
    margin-bottom: 6px;
  }
  .conf-row .name { width: 40px; }
  .conf-row .dots { letter-spacing: 1px; color: var(--c-primary); }
  .conf-row .n { font-family: var(--f-mono); }

  /* ---------- modal ---------- */
  .scrim {
    position: fixed; inset: 0;
    background: rgba(15,30,55,0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    animation: fadeIn .15s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: #fff;
    border-radius: 12px;
    box-shadow: var(--shadow-pop);
    width: 560px;
    max-height: 86vh;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .modal-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px;
    border-bottom: 1px solid var(--c-border);
  }
  .modal-head h3 { margin: 0; font-size: 16px; }
  .modal-close {
    width: 28px; height: 28px;
    background: transparent; border: none;
    font-size: 20px; color: var(--c-text-mute); cursor: pointer;
    border-radius: 4px;
  }
  .modal-close:hover { background: #f0f2f5; }
  .modal-tabs {
    display: flex;
    padding: 0 20px;
    border-bottom: 1px solid var(--c-border);
    gap: 4px;
  }
  .modal-tabs button {
    padding: 12px 14px;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--c-text-soft);
    font-size: 13px;
  }
  .modal-tabs button.active { color: var(--c-primary); border-bottom-color: var(--c-primary); font-weight: 500; }
  .modal-body {
    padding: 18px 20px;
    overflow-y: auto;
  }
  .modal-body .field { margin-bottom: 12px; }
  .modal-foot {
    padding: 12px 20px;
    border-top: 1px solid var(--c-border);
    display: flex; justify-content: flex-end; gap: 8px;
    background: #fafbfc;
  }
  .drop-zone {
    border: 2px dashed var(--c-border-strong);
    border-radius: 10px;
    padding: 30px;
    text-align: center;
    color: var(--c-text-mute);
    background: #fafbfc;
    cursor: pointer;
  }
  .drop-zone:hover, .drop-zone.over {
    border-color: var(--c-primary);
    background: #f3f8fd;
    color: var(--c-primary);
  }
  .file-info {
    margin-top: 10px;
    padding: 8px 12px;
    background: #eaf2fb;
    border-radius: 6px;
    font-family: var(--f-mono);
    font-size: 13px;
    color: var(--c-primary);
  }
  .preview-box {
    margin-top: 10px;
    text-align: center;
  }
  .preview-box img {
    max-width: 100%;
    max-height: 200px;
    border-radius: 6px;
    border: 1px solid var(--c-border);
  }
  details.advanced { margin-top: 6px; }
  details.advanced summary {
    cursor: pointer;
    font-size: 13px;
    color: var(--c-primary);
    padding: 4px 0;
  }
  details.advanced textarea {
    width: 100%;
    min-height: 100px;
    margin-top: 6px;
    border: 1px solid var(--c-border-strong);
    border-radius: var(--r-ctrl);
    padding: 8px;
    font-family: var(--f-mono);
    font-size: 12px;
  }
  /* PDF page tiles */
  .pdf-pages {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 12px;
    max-height: 240px;
    overflow-y: auto;
    padding: 4px;
  }
  .pdf-page {
    border: 2px solid var(--c-border);
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    background: #fff;
  }
  .pdf-page.on { border-color: var(--c-primary); }
  .pdf-page img { width: 100%; display: block; }
  .pdf-page .pn { position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.55); color: #fff; font-size: 10px;
    text-align: center; padding: 1px 0; font-family: var(--f-mono); }
  .pdf-page.on::after {
    content: "✓"; position: absolute; top: 2px; right: 4px;
    color: var(--c-primary); font-weight: 700; font-size: 14px;
    background: #fff; width: 16px; height: 16px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
  }
  /* Image-book import: source scans remain visually primary; controls stay compact. */
  .image-book-import {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .image-import-source {
    border: 1px solid #d8c9aa;
    border-radius: 12px;
    padding: 15px;
    background:
      linear-gradient(135deg, rgba(248, 242, 226, .96), rgba(242, 247, 250, .94)),
      repeating-linear-gradient(90deg, transparent 0 23px, rgba(104, 84, 48, .035) 24px);
  }
  .image-import-summary {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }
  .image-import-metric {
    padding: 9px 11px;
    border: 1px solid #e2e7ec;
    border-radius: 8px;
    background: rgba(255,255,255,.82);
  }
  .image-import-metric b {
    display: block;
    color: var(--c-nav);
    font-family: var(--f-serif);
    font-size: 18px;
    font-weight: 600;
  }
  .image-import-metric span { color: var(--c-text-mute); font-size: 11px; }
  .image-import-presets {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
  }
  .image-import-volume {
    border: 1px solid var(--c-border);
    border-radius: 10px;
    background: #fff;
    overflow: hidden;
  }
  .image-import-volume > summary {
    cursor: pointer;
    padding: 10px 12px;
    color: #31485d;
    font-size: 13px;
    font-weight: 600;
    background: #f8fafb;
    border-bottom: 1px solid var(--c-border);
  }
  .image-import-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 9px;
    padding: 10px;
    max-height: 360px;
    overflow-y: auto;
  }
  .image-import-card {
    min-width: 0;
    border: 1px solid #dfe4e8;
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
  }
  .image-import-card[data-mode="spread"] { border-color: #8cb4d7; }
  .image-import-card[data-mode="single"] { border-color: #b9a77f; }
  .image-import-card[data-mode="skip"] { opacity: .52; }
  .image-import-card img {
    width: 100%;
    height: 92px;
    display: block;
    object-fit: contain;
    background: #f5f1e7;
  }
  .image-import-card-body { padding: 7px; display: grid; gap: 6px; }
  .image-import-filename {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #50606f;
    font: 10.5px/1.4 var(--f-mono);
  }
  .image-import-card select { width: 100%; padding: 5px; font-size: 11.5px; }
  .image-import-confirm {
    display: flex;
    gap: 9px;
    align-items: flex-start;
    padding: 11px 12px;
    border: 1px solid #e3c98d;
    border-radius: 9px;
    background: #fff9e9;
    color: #6a5424;
    font-size: 12px;
    line-height: 1.6;
  }
  .image-import-confirm input { margin-top: 3px; }
  .image-import-progress {
    min-height: 230px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 14px;
    text-align: center;
  }

  /* ---------- settings drawer ---------- */
  .drawer-wrap {
    position: fixed; inset: 0;
    z-index: 80;
    display: flex; justify-content: flex-end;
    background: rgba(15,30,55,0.35);
    animation: fadeIn .15s;
  }
  .drawer {
    width: 420px;
    background: #fff;
    height: 100%;
    display: flex; flex-direction: column;
    box-shadow: var(--shadow-pop);
    animation: slideIn .2s;
  }
  @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: none; opacity: 1; } }
  .drawer-head, .drawer-foot {
    padding: 14px 20px;
    border-bottom: 1px solid var(--c-border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .drawer-foot { border-top: 1px solid var(--c-border); border-bottom: none; background: #fafbfc; }
  .drawer-body {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 18px 20px;
  }
  .drawer h3 { margin: 0; font-size: 16px; }
  .api-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px;
  }
  .api-row label { flex: 0 0 110px; font-size: 13px; color: var(--c-text-soft); }
  .api-row .val {
    flex: 1; min-width: 0;
    padding: 8px 10px;
    background: #f3f5f8;
    border-radius: var(--r-ctrl);
    font-family: var(--f-mono);
    font-size: 13px;
    color: var(--c-text-soft);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .api-row input {
    flex: 1; height: 32px;
    border: 1px solid var(--c-border-strong);
    border-radius: var(--r-ctrl);
    padding: 0 10px;
    font-family: var(--f-mono);
  }
  .api-row input:focus { outline: none; border-color: var(--c-primary); }
  .hint {
    font-size: 12px;
    color: var(--c-text-mute);
    line-height: 1.7;
    padding: 8px 12px;
    background: #f7f9fc;
    border-radius: 6px;
    margin-top: 10px;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 36px; height: 20px;
    flex-shrink: 0;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider {
    position: absolute; cursor: pointer; inset: 0;
    background: #cfd6df;
    border-radius: 10px;
    transition: .2s;
  }
  .switch .slider::before {
    content: ""; position: absolute;
    height: 16px; width: 16px;
    left: 2px; top: 2px;
    background: #fff; border-radius: 50%;
    transition: .2s;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  .switch input:checked + .slider { background: var(--c-primary); }
  .switch input:checked + .slider::before { transform: translateX(16px); }

  /* ---------- toast ---------- */
  .toast-wrap {
    position: fixed; top: 56px; right: 24px;
    z-index: 200;
    display: flex; flex-direction: column; gap: 8px;
    pointer-events: none;
  }
  .toast {
    background: #fff;
    border-left: 4px solid var(--c-primary);
    box-shadow: var(--shadow-pop);
    border-radius: 6px;
    padding: 10px 16px 10px 14px;
    font-size: 13px;
    min-width: 260px;
    animation: toastIn .25s;
  }
  .toast.success { border-left-color: var(--c-success); }
  .toast.warn    { border-left-color: var(--c-warning); }
  .toast.error   { border-left-color: var(--c-error); }
  .toast.info    { border-left-color: var(--c-primary); color: var(--c-text-soft); }
  @keyframes toastIn { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ---------- dropdown ---------- */
  .dropdown { position: relative; display: inline-block; }
  .dropdown-menu {
    position: absolute;
    right: 0; top: calc(100% + 6px);
    background: #fff;
    border: 1px solid var(--c-border);
    border-radius: 8px;
    box-shadow: var(--shadow-pop);
    min-width: 240px;
    overflow: hidden;
    z-index: 50;
  }
  .dropdown-menu button {
    display: block; width: 100%;
    text-align: left;
    background: transparent; border: none;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--c-text);
  }
  .dropdown-menu button:hover { background: #f3f5f8; }
  .dropdown-menu .sep { height: 1px; background: var(--c-border); }
  .dropdown-menu .meta { font-size: 11.5px; color: var(--c-text-mute); padding-left: 22px; }

  /* lightbox */
  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    z-index: 150;
    display: flex; align-items: center; justify-content: center;
    cursor: zoom-out;
    animation: fadeIn .15s;
  }
  .lightbox img { max-width: 95vw; max-height: 95vh; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }

  .batch-progress {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #fff;
    border-radius: 10px;
    box-shadow: var(--shadow-pop);
    padding: 14px 20px;
    z-index: 90;
    min-width: 320px;
  }
  .batch-progress .pct {
    display: flex; justify-content: space-between;
    font-size: 13px; margin-bottom: 6px;
  }
  .batch-progress .progress-bar > div { background: var(--c-progress); }

  /* ---- 标注队列监控视图 ---- */
  .bmon-wrap { padding: 24px 28px; max-width: 1400px; margin: 0 auto; }
  .bmon-title { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .bmon-book-group-head {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 4px 6px; margin-top: 16px; cursor: pointer;
    border-bottom: 2px solid var(--c-border);
  }
  .bmon-book-group-head:hover .bmon-book-name { color: var(--c-primary); }
  .bmon-book-name { font-size: 14px; font-weight: 600; color: #21384f; flex: 1; }
  .bmon-book-badges { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
  .bmon-book-prog-bar {
    width: 100%; height: 3px; background: #e8edf2; border-radius: 999px; overflow: hidden; flex-basis: 100%;
  }
  .bmon-book-prog-fill { height: 100%; background: #4caf50; border-radius: 999px; }
  .bmon-subtitle { font-size: 13px; color: var(--c-text-soft); margin: 0 0 18px; }
  .bmon-job-card {
    background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    padding: 16px 20px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px;
  }
  .bmon-job-bar-wrap { display: flex; align-items: center; gap: 12px; }
  .bmon-job-bar { flex: 1; height: 8px; background: #e8eaed; border-radius: 4px; overflow: hidden; }
  .bmon-job-bar-fill { height: 100%; background: var(--c-primary); border-radius: 4px; transition: width .3s; }
  .bmon-job-stat { font-size: 13px; color: var(--c-text-soft); white-space: nowrap; }
  .bmon-job-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .bmon-filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .bmon-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .bmon-table th { text-align: left; padding: 8px 10px; font-size: 11px; font-weight: 600;
    color: var(--c-text-mute); border-bottom: 1px solid var(--c-border); letter-spacing: .5px; text-transform: uppercase; }
  .bmon-table td { padding: 9px 10px; border-bottom: 1px solid #f0f1f3; vertical-align: middle; }
  .bmon-table tr:hover td { background: #fafbfc; }
  .bmon-table .st-pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px;
    border-radius: 99px; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
  .bmon-table .st-running { background: #e3f2fd; color: #1565c0; }
  .bmon-table .st-todo    { background: #eef0f3; color: #6b7280; }
  .bmon-table .st-review  { background: #fff4e3; color: #c2680a; }
  .bmon-table .st-ok      { background: #e6f5e7; color: #2f8a36; }
  .bmon-table .st-bad     { background: #fdecea; color: #c1352b; }
  .bmon-empty { padding: 40px; text-align: center; color: var(--c-text-mute); font-size: 14px; }

  /* placeholder when no image selected */
  .placeholder-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%;
    color: var(--c-text-mute);
    text-align: center;
    padding: 40px;
  }
  .placeholder-state .glyph {
    font-size: 64px;
    font-family: var(--f-serif);
    color: #d4d4d4;
    margin-bottom: 8px;
  }
  .placeholder-state .title { font-size: 15px; color: var(--c-text-soft); margin-bottom: 4px; }
  .placeholder-state .sub { font-size: 13px; }

  /* confirm dialog */
  .confirm {
    background: #fff;
    border-radius: 10px;
    width: 380px;
    padding: 20px;
    box-shadow: var(--shadow-pop);
  }
  .confirm h3 { margin: 0 0 8px; font-size: 15px; }
  .confirm p { margin: 0 0 16px; color: var(--c-text-soft); font-size: 13.5px; line-height: 1.7; }
  .confirm .row { display: flex; justify-content: flex-end; gap: 8px; }

  /* ---------- v1.1 additions ---------- */
  .left-tabs {
    display: flex;
    border-bottom: 1px solid var(--c-border);
    background: transparent;
  }
  .left-tab {
    flex: 1;
    padding: 11px 0;
    border: none;
    border-bottom: 2px solid transparent;
    background: transparent;
    color: var(--c-text-soft);
    font-size: 13px;
    font-weight: 500;
  }
  .left-tab.active {
    color: var(--c-primary);
    border-bottom-color: var(--c-primary);
    background: transparent;
  }
  .left-tab-badge {
    display: inline-block;
    min-width: 18px;
    padding: 0 5px;
    margin-left: 4px;
    background: rgba(46,109,164,0.15);
    border-radius: 9px;
    font-size: 10.5px;
    font-family: var(--f-mono);
    color: var(--c-primary);
    line-height: 16px;
  }

  /* book list item（IDE 文件树风格：无边框，hover 变底，active 左侧指示条） */
  .book-card {
    background: transparent;
    border: none;
    border-left: 3px solid transparent;
    border-radius: 6px;
    padding: 9px 10px 8px;
    margin: 1px 6px;
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease;
  }
  .book-card:hover {
    background: rgba(46, 109, 164, 0.06);
  }
  .book-card.active {
    border-left-color: var(--c-primary);
    background: rgba(46, 109, 164, 0.09);
  }
  .book-card .title {
    font-family: var(--f-serif);
    font-size: 14.5px;
    font-weight: 600;
    color: #2c3a4f;
    margin-bottom: 4px;
    line-height: 1.4;
  }
  /* left-panel book card progress */
  .book-card-progress { margin-top: 6px; display: flex; align-items: center; gap: 6px; }
  .book-card-progress-bar {
    flex: 1; height: 4px; background: #e8edf2; border-radius: 999px; overflow: hidden;
  }
  .book-card-progress-fill { height: 100%; background: #4caf50; border-radius: 999px; transition: width .3s; }
  .book-card-progress-label { font-size: 10.5px; color: var(--c-text-mute); white-space: nowrap; flex-shrink: 0; }
  .group-book-card { cursor: pointer; }
  .group-book-card:hover .title {
    color: var(--c-primary);
  }
  /* merge mode & book groups */
  .book-card { position: relative; }
  .book-card .merge-check {
    display: none;
    position: absolute; top: 8px; right: 8px;
    width: 18px; height: 18px;
    border: 2px solid #c5cfd8; border-radius: 4px; background: #fff;
    align-items: center; justify-content: center; font-size: 12px;
    pointer-events: none;
  }
  body.merge-mode .book-card { cursor: pointer; }
  body.merge-mode .book-card .merge-check { display: flex; }
  body.merge-mode .book-card.merge-selected { border-color: var(--c-primary); background: #f0f6ff; }
  body.merge-mode .book-card.merge-selected .merge-check {
    border-color: var(--c-primary); background: var(--c-primary); color: #fff;
  }
  /* group header row (replaces .group-label) */
  .group-header-row {
    display: flex; align-items: center; gap: 0;
    padding: 8px 10px 4px; cursor: pointer; border-radius: 5px;
    user-select: none; margin: 0 4px;
    transition: background .12s;
  }
  .group-header-row:hover { background: #f0f3f7; }
  .group-collapse-btn {
    flex-shrink: 0; width: 20px; text-align: center;
    font-size: 10px; color: var(--c-text-mute);
    padding: 2px 0; border-radius: 3px;
    transition: transform .15s;
  }
  .group-header-row.collapsed .group-collapse-btn { transform: rotate(-90deg); }
  .group-header-title {
    flex: 1; display: flex; align-items: center; gap: 4px;
    font-size: 11.5px; font-weight: 600; color: var(--c-text-mute);
    min-width: 0;
  }
  .group-header-row.preview-active .group-header-title { color: var(--c-primary); }
  .group-divider { height: 1px; background: var(--c-border); margin: 0 8px 4px; }
  /* group meta edit panel in right pane */
  .group-meta-field { margin-bottom: 10px; }
  .group-meta-field label {
    display: block; font-size: 11px; color: var(--c-text-mute); margin-bottom: 3px;
  }
  .group-meta-field input, .group-meta-field textarea {
    width: 100%; box-sizing: border-box;
    border: 1px solid var(--c-border); border-radius: 5px;
    padding: 6px 8px; font-size: 13px; font-family: inherit;
    background: #fff; color: var(--c-text);
  }
  .group-meta-field textarea { min-height: 90px; resize: vertical; }
  .group-meta-field input:focus, .group-meta-field textarea:focus {
    outline: none; border-color: var(--c-primary);
    box-shadow: 0 0 0 2px rgba(31,91,153,.12);
  }
  .group-volumes-section { margin-top: 14px; }
  .group-volumes-head {
    font-size: 11px; font-weight: 600; color: var(--c-text-mute);
    padding-bottom: 5px; border-bottom: 1px solid var(--c-border); margin-bottom: 4px;
  }
  .group-volume-item {
    width: 100%;
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 5px; cursor: pointer; font-size: 13px;
    transition: background .1s, color .1s;
    border: 0; background: transparent; text-align: left;
  }
  .group-volume-item:hover { background: #f5f7fa; }
  .group-volume-item.active { background: #eef4fb; color: var(--c-primary); }
  .group-volume-item-bullet { width: 12px; flex: 0 0 12px; text-align: center; color: #8fa0b5; }
  .group-volume-item.active .group-volume-item-bullet { color: var(--c-primary); }
  .group-volume-item-text { flex: 1; min-width: 0; font-size: 13px; }
  .group-volume-item-meta { flex: 0 0 auto; font-size: 11px; color: var(--c-text-mute); }
  .merge-confirm-row { display: flex; gap: 6px; margin-top: 4px; }
  /* book preview in right pane */
  .book-card.preview-active { border-left-color: #a0b8d8; background: rgba(46, 109, 164, 0.05); }
  .book-preview-cover-wrap {
    background: #eef0f4; border-radius: 8px; overflow: hidden;
    min-height: 80px; display: flex; align-items: center; justify-content: center;
    margin-bottom: 12px;
  }
  .book-preview-cover { width: 100%; display: block; }
  .book-preview-cover-loading { font-size: 12px; color: var(--c-text-mute); padding: 20px 0; }
  .book-preview-title {
    font-family: var(--f-serif); font-size: 16px; font-weight: 700;
    color: #2c3a4f; margin: 0 0 4px; line-height: 1.4;
  }
  .book-preview-meta { font-size: 12px; color: var(--c-text-mute); margin-bottom: 4px; }
  .book-preview-stats { display: flex; gap: 6px; margin: 10px 0 12px; }
  .book-preview-stat {
    flex: 1; background: #f5f7fa; border-radius: 6px; padding: 8px 4px; text-align: center;
  }
  .book-preview-stat .num { font-size: 20px; font-weight: 700; color: var(--c-primary); line-height: 1.2; }
  .book-preview-stat .lbl { font-size: 10.5px; color: var(--c-text-mute); margin-top: 2px; }
  /* gallery */
  .gallery-bar {
    display: flex; justify-content: space-between; align-items: center;
    flex: 1 1 480px;
    min-width: 0;
    gap: 10px;
    background: transparent;
    padding: 9px 0;
    border-radius: 0;
    box-shadow: none;
    margin-bottom: 0;
  }
  .gallery-bar .crumb {
    font-family: var(--f-serif);
    font-size: 15px;
    color: var(--c-text);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .gallery-bar .crumb .light { color: var(--c-text-mute); font-weight: 400; }
  .gallery-bar-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .crumb-link {
    appearance: none;
    border: none;
    background: transparent;
    padding: 0;
    margin: 0;
    font: inherit;
    color: inherit;
    cursor: pointer;
  }
  .crumb-link:hover { color: var(--c-primary); }
  .crumb-sep {
    color: var(--c-text-mute);
    font-size: 14px;
  }
  .gallery-toolbar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    background: transparent;
    padding: 10px 0;
    border-radius: 0;
    box-shadow: none;
    border-bottom: 1px solid var(--c-border);
    margin-bottom: 10px;
    font-size: 13px; color: var(--c-text-soft);
  }
  .gallery-toolbar select {
    height: 28px; padding: 0 8px;
    border: 1px solid var(--c-border-strong);
    border-radius: var(--r-ctrl);
    background: #fff;
  }
  .gallery-toolbar .seg {
    display: inline-flex;
    border: 1px solid var(--c-border-strong);
    border-radius: var(--r-ctrl);
    overflow: hidden;
  }
  .gallery-toolbar .seg button {
    border: none;
    padding: 5px 10px;
    background: #fff;
    color: var(--c-text-soft);
    font-size: 12.5px;
    cursor: pointer;
  }
  .gallery-toolbar .seg button.on {
    background: var(--c-primary); color: #fff;
  }
  .workspace-section {
    display: grid;
    gap: 10px;
    margin-bottom: 14px;
  }
  .workspace-section-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  .workspace-section-head h3 {
    margin: 0;
    font-family: var(--f-serif);
    font-size: 18px;
    color: var(--c-text);
  }
  .workspace-section-head .sub {
    font-size: 12px;
    color: var(--c-text-mute);
  }
  .book-metric-grid {
    background: #fff;
    border-radius: 12px;
    box-shadow: var(--shadow-card);
    padding: 14px 16px;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
  }
  .book-metric-card .label {
    font-size: 12px;
    color: var(--c-text-mute);
    margin-bottom: 4px;
  }
  .book-metric-card .value {
    font-size: 22px;
    font-weight: 700;
    color: var(--c-text);
  }
  .book-metric-card .note {
    font-size: 11px;
    color: var(--c-text-soft);
    margin-top: 4px;
  }
  .template-preview {
    margin-top: 10px;
    background: #f4f1e7;
    border: 1px solid var(--c-border);
    border-radius: 10px;
    padding: 10px;
  }
  .template-preview-stage {
    position: relative;
    display: inline-block;
    max-width: 100%;
    background: #fafaf6;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .template-preview-image {
    display: block;
    max-width: 100%;
    height: auto;
    margin: 0 auto;
  }
  .template-preview.editing .template-preview-image {
    max-height: 420px;
    width: auto;
  }
  .template-overlay {
    position: absolute;
    pointer-events: auto;
  }
  .template-overlay.text {
    background: rgba(255,152,0,0.18);
    border: 2px solid rgba(255,152,0,0.9);
  }
  .template-handle {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 999px;
    background: #ff9800;
    border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.18);
    pointer-events: none;
  }
  .toolbar-inline-group {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--c-text-mute);
  }
  .toolbar-inline-group label {
    font-size: 11px;
    color: var(--c-text-mute);
    font-weight: 600;
  }
  .toolbar-more {
    position: relative;
    z-index: 1;
  }
  .toolbar-more[open] {
    z-index: 120;
  }
  .toolbar-more summary {
    list-style: none;
    cursor: pointer;
    user-select: none;
    height: 28px;
    padding: 0 10px;
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--c-border-strong);
    border-radius: var(--r-ctrl);
    background: #fff;
    font-size: 12.5px;
    color: var(--c-text-soft);
  }
  .toolbar-more summary::-webkit-details-marker { display: none; }
  .toolbar-more[open] summary {
    color: var(--c-primary);
    border-color: var(--c-primary);
  }
  .toolbar-more-panel {
    position: absolute;
    right: 0;
    bottom: calc(100% + 6px);
    top: auto;
    z-index: 140;
    min-width: 220px;
    background: #fff;
    border: 1px solid var(--c-border);
    border-radius: 8px;
    box-shadow: var(--shadow-card);
    padding: 10px;
    display: grid;
    gap: 10px;
  }
  .toolbar-more-row {
    display: grid;
    gap: 6px;
  }
  .toolbar-more-row label {
    font-size: 11px;
    color: var(--c-text-mute);
    font-weight: 600;
  }
  .toolbar-more-row .seg { width: fit-content; }
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
  }
  .gallery-card {
    --gallery-state-bg: #fff;
    --gallery-state-line: var(--c-border);
    --gallery-state-text: var(--c-text);
    background: #fff;
    border: 1px solid var(--c-border);
    border-radius: 8px;
    box-shadow: var(--shadow-card);
    overflow: hidden;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    display: flex; flex-direction: column;
  }
  .gallery-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
  }
  /* gallery card state borders */
  .gallery-card.st-pending {
    --gallery-state-bg: #fff7df;
    --gallery-state-line: #d4a017;
    --gallery-state-text: #8a5a00;
    border: 2px solid #d4a017;
    border-top: 4px solid #d4a017;
    background: #fffcf0;
  }
  .gallery-card.st-confirmed {
    --gallery-state-bg: #eef8ef;
    --gallery-state-line: #3a9c47;
    --gallery-state-text: #246d30;
    border: 2px solid #3a9c47;
    border-top: 4px solid #3a9c47;
    background: #f4faf4;
  }
  /* illustration-scope annotation status */
  .gallery-card.st-ann-todo {
    --gallery-state-bg: #eaf4ff;
    --gallery-state-line: #2196f3;
    --gallery-state-text: #1769aa;
    border: 2px solid #2196f3;
    border-top: 4px solid #2196f3;
  }
  .gallery-card.st-ann-review {
    --gallery-state-bg: #fff1df;
    --gallery-state-line: #ff9800;
    --gallery-state-text: #a65b00;
    border: 2px solid #ff9800;
    border-top: 4px solid #ff9800;
  }
  .gallery-card.st-ann-ok {
    --gallery-state-bg: #eef8ef;
    --gallery-state-line: #3a9c47;
    --gallery-state-text: #246d30;
    border: 2px solid #3a9c47;
    border-top: 4px solid #3a9c47;
    background: #f4faf4;
  }
  .gallery-card.st-ann-bad {
    --gallery-state-bg: #f0f0f0;
    --gallery-state-line: #9e9e9e;
    --gallery-state-text: #666;
    border: 2px solid #9e9e9e;
    border-top: 4px solid #9e9e9e;
    background: #f7f7f7;
  }
  .status-dot {
    position: absolute; bottom: 6px; right: 6px;
    width: 10px; height: 10px; border-radius: 50%;
    border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35);
    pointer-events: none;
  }
  .status-dot.todo    { background: #2196f3; }
  .status-dot.review  { background: #ff9800; }
  .status-dot.ok      { background: #4caf50; }
  .status-dot.running { background: #9e9e9e; }
  .status-dot.bad     { background: #9e9e9e; }
  .multi-warn {
    position: absolute; top: 5px; left: 6px; font-size: 13px;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.4));
    pointer-events: none;
  }
  .gallery-card .thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    background: #fafaf6 center/contain no-repeat;
    border-bottom: 1px solid var(--gallery-state-line);
  }
  .gallery-card .thumb.loading {
    background: linear-gradient(90deg, #f0ede4 25%, #e8e4d9 50%, #f0ede4 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
  }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .gallery-card.selection-mode {
    cursor: pointer;
    outline: 2px dashed #8eb9d6;
    outline-offset: -2px;
  }
  .gallery-card.selection-mode:hover,
  .gallery-list-row.selection-mode:hover { background: #f1f8fc; }
  .gallery-card.selection-mode.selected {
    --gallery-state-bg: #dfefff;
    --gallery-state-line: var(--c-primary);
    --gallery-state-text: #124f7b;
    outline: 3px solid var(--c-primary);
    outline-offset: -3px;
    box-shadow: 0 5px 18px rgba(31,95,142,.20);
  }
  .gallery-list-row.selection-mode { outline: none; }
  .gallery-list-row.selection-mode.selected { box-shadow: inset 4px 0 0 var(--c-primary); }
  .gallery-card .info {
    padding: 8px 10px;
    display: flex; flex-direction: column; gap: 4px;
    background: var(--gallery-state-bg);
    border-top: 1px solid color-mix(in srgb, var(--gallery-state-line) 35%, white);
    box-shadow: inset 4px 0 0 var(--gallery-state-line);
  }
  .gallery-card .info .pn {
    font-family: var(--f-mono);
    font-size: 13px;
    color: var(--gallery-state-text);
  }
  .gallery-card .info .added-tag {
    font-size: 11px; color: var(--c-success);
  }
  .gallery-selectionbar {
    position: sticky;
    top: 0;
    z-index: 8;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0 0 12px;
    padding: 10px 12px;
    border: 1px solid #d8e1e9;
    border-left: 4px solid var(--c-primary);
    border-radius: 8px;
    background: rgba(255,255,255,.96);
    box-shadow: 0 5px 18px rgba(35,54,70,.10);
    backdrop-filter: blur(8px);
  }
  .gallery-selectionbar-group { display: inline-flex; gap: 6px; }
  .gallery-selectionbar .spacer { flex: 1; }
  .gallery-action-panel-head {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding-right: 10px;
    border-right: 1px solid var(--c-border);
  }
  .gallery-action-range {
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .gallery-action-hint {
    color: var(--c-text-soft);
    font-size: 12px;
    white-space: nowrap;
  }
  .gallery-selection-summary {
    color: var(--c-text-soft);
    font-size: 12.5px;
    font-weight: 650;
    white-space: nowrap;
  }
  .gallery-scan-progress {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin: 0 0 10px;
    padding: 10px 14px;
    border: 1px solid #b9d4e9;
    border-left: 4px solid #2e7eb6;
    border-radius: 8px;
    background: #f3f8fc;
    box-shadow: 0 1px 0 rgba(17,72,111,.05);
  }
  .gallery-scan-progress-title {
    font-size: 13px;
    font-weight: 750;
    white-space: nowrap;
  }
  .gallery-scan-progress-status {
    color: #294d66;
    font-size: 13px;
    white-space: nowrap;
  }
  .gallery-scan-progress-track {
    flex: 1;
    min-width: 120px;
    height: 8px;
    overflow: hidden;
    border-radius: 99px;
    background: #dceaf4;
  }
  .gallery-scan-progress-fill {
    height: 100%;
    border-radius: 99px;
    transition: width .2s ease;
  }
  .gallery-scan-progress-counts {
    color: #5e7384;
    font-size: 12px;
    white-space: nowrap;
  }
  .gallery-scan-failures {
    flex-basis: 100%;
    padding-top: 8px;
    border-top: 1px solid #d6e4ee;
    color: #7b3d2c;
    font-size: 12px;
  }
  .gallery-scan-failures summary {
    width: fit-content;
    cursor: pointer;
    color: #9b3f29;
    font-weight: 700;
  }
  .gallery-scan-failure-row {
    display: grid;
    grid-template-columns: minmax(120px, 240px) 1fr;
    gap: 10px;
    margin-top: 7px;
    padding: 7px 9px;
    border-radius: 6px;
    background: #fff4ef;
    line-height: 1.55;
  }
  .gallery-page-range-input {
    width: 190px;
    height: 30px;
    padding: 0 9px;
    border: 1px solid var(--c-border-strong);
    border-radius: var(--r-ctrl);
    background: #fff;
    font-size: 12px;
  }

  /* page detail（去卡片化：书页直接浮在工作区上，head 用分隔线） */
  .pd-card {
    background: transparent;
    border-radius: 0;
    box-shadow: none;
    margin-bottom: 14px;
  }
  .pd-head {
    padding: 10px 0;
    border-bottom: 1px solid var(--c-border);
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: start;
    gap: 10px 16px;
  }
  .pd-head .pd-title {
    font-family: var(--f-serif);
    font-size: 15px;
    min-width: 0;

  }

    top: 0;
    bottom: 0;

    align-items: center;

  .pd-side-nav.next { right: 0; border-radius: 0 8px 8px 0; }

    background: rgba(46, 109, 164, 0.08);

  .pd-side-nav:disabled {
    opacity: 0.25;

  .pd-text {
    background: var(--c-paper);
    border: 1px solid #ece6d0;
    border-radius: 8px;
    padding: 14px 18px;
    font-family: var(--f-serif);
    font-size: 14.5px;
    line-height: 1.9;
    color: #3a2f1a;
    margin-top: 14px;
    max-height: 220px;

    overflow: hidden;
    margin-top: 14px;

    font-size: 12px; font-weight: 600; color: #5a4a2a;
  }
  .ta-badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 600;
  }

  .ta-badge.src-ocr   { background: #e8f5e9; color: #2e7d32; }

  .ta-badge.st-extracted{ background: #e8f5e9; color: #2e7d32; }
  .ta-badge.st-reviewed { background: #e3f2fd; color: #1565c0; }

  .ta-label { font-size: 11px; color: #8a7a4a; font-weight: 600; letter-spacing: 0.3px; margin-bottom: 4px; }
  .ta-textarea {
    width: 100%; box-sizing: border-box;
    font-family: var(--f-serif); font-size: 14px; line-height: 1.85; color: #3a2f1a;
    background: #fff; border: 1px solid #ddd8c4; border-radius: 6px;

  .ta-associated { min-height: 60px; background: #fffbf0; border-color: #d4a030; }
  .ta-divider { border: none; border-top: 1px dashed #e0d8b8; margin: 10px 0; }
  .ta-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; overflow: visible; align-items: flex-start; }

  .pd-nav {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 14px;
    color: var(--c-text-soft);
    font-size: 13px;
  }
  .pd-nav button {
    background: #fff;
    border: 1px solid var(--c-border-strong);
    border-radius: var(--r-ctrl);
    padding: 6px 14px;
    color: var(--c-text-soft);

  .pd-nav button:hover:not(:disabled) { border-color: var(--c-primary); color: var(--c-primary); }

  /* page view: full page + overlays */

  }

    background: #f0eee5;

    padding: 10px;

    display: flex;

  .pd-page-pane.reading .pd-page-image,

  .pd-page-wrap canvas {
    display: block;

    height: auto;

  .pd-page-spread.solo .pd-page-image {
    max-height: calc(100vh - 260px);
  }
  .ocr-proof-wrap {
    display: grid;
    grid-template-columns: minmax(360px, 0.9fr) minmax(340px, 1fr);
    gap: 16px;
    align-items: stretch;
  }
  .shell.reference-workspace .ocr-proof-wrap {
    grid-template-columns: minmax(280px, 0.9fr) minmax(320px, 1fr);
  }
  .ocr-proof-wrap.editor-collapsed,
  .shell.reference-workspace .ocr-proof-wrap.editor-collapsed {
    grid-template-columns: 46px minmax(0, 1fr);
    gap: 10px;

  @media (max-width: 840px) {
    .ocr-proof-wrap {
      grid-template-columns: 1fr;

  .ocr-proof-image-card,

    background: #fff;

  .ocr-proof-guide-button {

  .proofreading-guide {
    position: absolute;

    border: 2px solid #fff9ed;
    border-radius: 50%;

    align-items: center;
    justify-content: center;

  .asset-desk-canvas-frame { position:relative; width:min(100%,520px,calc((100vh - 226px) * .706)); aspect-ratio:var(--canvas-ratio); overflow:hidden; border:1px solid #cfc1a8; border-radius:4px; background:#f5f0e4; box-shadow:0 9px 23px rgba(55,39,18,.15); }

  .asset-desk-composite-frame { background:repeating-conic-gradient(#f1ecdf 0 25%,#fffdf8 0 50%) 50% / 16px 16px; }

  .asset-desk-empty { padding:35px 18px; border:1px dashed #cfc2aa; border-radius:8px; background:#fbf7ed; color:#867b6a; text-align:center; line-height:1.8; }

  .asset-desk-layer-card b { display:block; overflow:hidden; color:#493d2e; font-size:12px; line-height:1.35; text-overflow:ellipsis; white-space:nowrap; }
  .asset-desk-layer-card small { display:block; margin-top:3px; color:#917d5d; font-size:10px; }
  .asset-desk-layer-card em { display:block; margin-top:2px; overflow:hidden; color:#978b7a; font:9px var(--f-mono); font-style:normal; text-overflow:ellipsis; white-space:nowrap; }
  .asset-desk-layer-tools { display:flex; gap:8px; align-items:center; margin-top:9px; }
  .asset-desk-layer-tools select { width:100%; min-width:0; font-size:11px; }
  @media (max-width: 1080px) { .asset-desk-layout { grid-template-columns:190px minmax(0,1fr) 190px; } .asset-desk-compare-stage { gap:8px; } }
  @media (max-width: 760px) { .asset-desk { padding:12px; } .asset-desk-layout { grid-template-columns:1fr; } .asset-desk-index,.asset-desk-layer-rail { position:static; } .asset-desk-index-list,.asset-desk-layer-list { max-height:175px; } .asset-desk-title { font-size:21px; } .asset-desk-compare-stage { grid-template-columns:1fr; } }
  .merged-composite-image {

  .ocr-proof-textarea-stack {

  .ocr-proof-textarea {
    display: block;
    position: relative;
    z-index: 2;

    padding: 12px 14px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: #fff;
    color: #2b2114;
    font-family: var(--f-serif);
    font-size: 22px;
    line-height: 2;
    white-space: pre-wrap;

  .ocr-proof-textarea-stack:not(.has-comparison) .ocr-proof-comparison-layer {

  .pd-overlay {

    background: rgba(33,150,243,0.22);
  }

    background: rgba(255,152,0,0.18);

  /* import progress */
  .import-step {
    display: flex; gap: 10px; align-items: center;
    padding: 8px 0;
    font-size: 13px;
  }
  .import-step .icon { width: 18px; text-align: center; }
  .import-step.done .icon { color: var(--c-success); }
  .import-step.running .icon { color: var(--c-progress); animation: spin 1s linear infinite; }
  .import-step.todo { color: var(--c-text-mute); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .import-progress { margin: 10px 0; }

  /* slider */
  .slider-row {
    display: flex; align-items: center; gap: 10px;
    margin: 6px 0;
    font-size: 12.5px; color: var(--c-text-soft);
  }
  .slider-row input[type=range] {
    flex: 1; accent-color: var(--c-primary);
  }
  .slider-row .end-label {
    min-width: 30px;
    text-align: center;
    font-family: var(--f-mono);
  }

  /* source tab */
  .src-block {
    background: #f7f9fc;
    border: 1px solid var(--c-border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--c-text);
    margin-bottom: 12px;
  }
  .src-block .row {
    display: flex; justify-content: space-between;
    padding: 4px 0;
  }
  .src-block .row .k { color: var(--c-text-mute); }
  .src-block .row .v { color: var(--c-text); font-weight: 500; max-width: 60%; text-align: right; }

    background: var(--c-paper);
    border: 1px solid #ece6d0;
    border-radius: 8px;
    padding: 12px 14px;
    font-family: var(--f-serif);
    font-size: 13.5px;
    line-height: 1.9;

    overflow-y: auto;
    user-select: text;
    white-space: pre-wrap;
  }
  .src-quote {
    background: #fff8d6;
    border-left: 3px solid #c5a93b;
    padding: 8px 12px;
    font-family: var(--f-serif);
    font-size: 13.5px;
    line-height: 1.85;
    border-radius: 0 6px 6px 0;
    color: #5a4a2a;
    margin: 6px 0;
  }

  .breadcrumb-back {
    background: transparent;
    border: 1px solid var(--c-border-strong);
    color: var(--c-text-soft);
    border-radius: var(--r-ctrl);
    padding: 5px 12px;
    font-size: 12.5px;
    cursor: pointer;
  }
  .breadcrumb-back:hover { border-color: var(--c-primary); color: var(--c-primary); }

  /* ---------- step-bar ---------- */
  .step-bar {
    display: flex;
    align-items: center;
    flex: 0 0 auto;
    padding: 9px 0;
    background: transparent;
    border-radius: 0;
    box-shadow: none;
    margin-bottom: 0;
    flex-wrap: nowrap;
    overflow: hidden;
  }
  /* 全宽 header 带内：步骤条独占一行并水平居中（位于面包屑下方、整窗居中） */
  #main-header > .step-bar {
    flex: 1 1 100%;
    justify-content: center;
  }
  /* 步骤条移入内容区时：水平居中，与下方内容留间距 */
  .step-bar-content {
    display: flex;
    justify-content: center;
    margin-bottom: 12px;
  }
  .step-item {
    display: flex;
    align-items: center;
    gap: 5px;
    flex: 0 0 auto;
    min-width: 0;
    font-size: 12px;
    color: var(--c-text-mute);
    white-space: nowrap;
  }
  .step-item.active { color: var(--c-primary); font-weight: 600; }
  .step-item.done   { color: var(--c-success); }
  .step-num {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--c-border);
    color: #999;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
    flex-shrink: 0;
  }
  .step-item.active .step-num { background: var(--c-primary); color: #fff; }
  .step-item.done   .step-num { background: var(--c-success);  color: #fff; }
  .step-arrow { color: var(--c-border-strong); padding: 0 6px; font-size: 13px; flex-shrink: 0; }
  .step-item.clickable { cursor: pointer; }
  .step-item.clickable:hover { color: var(--c-primary-dark); }
  .step-item.clickable:hover .step-num { background: var(--c-primary-dark); color: #fff; }
  .step-item.done.clickable:hover .step-num { background: var(--c-primary-dark); }

  /* 书组卷次拖拽排序 */
  .vol-drag-handle:active { cursor: grabbing; }
  .vol-row.dragging { opacity: 0.4; }
  .vol-row.drop-over {
    border-color: var(--c-primary) !important;
    box-shadow: inset 0 2px 0 0 var(--c-primary);
  }
</style>
</head>
